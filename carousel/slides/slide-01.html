<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trueline carousel — 01 hook</title>
<link rel="stylesheet" href="slides.css">
<style>
  .hook{padding:0}
  /* photo band up top, solid slate below — the headline never sits on texture */
  .band{
    height:566px;flex:none;position:relative;overflow:hidden;
    background:url("../assets/roof-dark.jpg") center 42% / cover no-repeat;
  }
  .band::after{                       /* fade the plate into the slate below it */
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,
      rgba(22,35,46,.58) 0%, rgba(22,35,46,.18) 30%,
      rgba(22,35,46,.30) 66%, var(--slate) 100%);
  }
  .band .rail{
    position:absolute;z-index:2;top:74px;left:var(--pad-x);right:var(--pad-x);
  }
  .band .rail span{color:rgba(246,244,239,.86)}
  .band .rail .count{color:var(--copper-light)}

  .lower{
    flex:1;display:flex;flex-direction:column;
    padding:0 var(--pad-x) 70px;
  }
  .hook .h1{font-size:92px;line-height:1.03}
  .peso{letter-spacing:.06em}
  .kicker{
    font-size:20px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:var(--copper-light);
  }
</style>
</head>
<body>
<div class="slide dark hook">

  <div class="band">
    <div class="rail">
      <span>Trueline Roof Care</span>
      <span class="count">Santa Rosa, Laguna</span>
    </div>
  </div>

  <div class="lower">
    <div class="kicker" style="margin:8px 0 26px">Cabuyao, 2018 &middot; the job that started this</div>

    <div class="h1"><span class="peso">&#8369;</span>410,000<br>for a roof that<br>had ten years left.</div>

    <div class="rule" style="margin:34px 0 30px"></div>

    <div class="body" style="max-width:820px">
      We took the old panels off and the purlins underneath were clean.
      The actual problem was two meters of unsealed ridge roll.
    </div>

    <div class="spacer"></div>

    <div class="swipe">
      Six signs it&rsquo;s a repair, not a re-roof
      <svg width="30" height="14" viewBox="0 0 30 14" aria-hidden="true">
        <path d="M0 7h26M21 2l5 5-5 5" stroke="#E0975E" stroke-width="2.6"
              fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trueline carousel — 06 sign 05, unsealed ridge roll</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="slide">

  <div class="rail">
    <span>Sign 05 of 06</span>
    <span class="count">Repair, not re-roof</span>
  </div>

  <div class="h2" style="margin-top:50px">A ridge roll<br>nobody has sealed</div>

  <div class="plate" style="margin-top:36px">
    <svg width="900" height="448" viewBox="0 0 900 448" role="img"
         aria-label="Cross section at the apex: the ridge cap is fitted but the sealant bead beneath it is missing, so wind-driven rain runs under the cap and falls straight through the open apex.">

      <!-- the void where the sealant bead should be -->
      <polygon points="300,246 400,183.3 400,214 300,259.6" fill="#C4622D" opacity=".28"/>
      <polygon points="600,246 500,183.3 500,214 600,259.6" fill="#C4622D" opacity=".28"/>

      <!-- roof planes, stopping short of each other under the cap -->
      <path d="M80 360 L400 214" stroke="#16232E" stroke-width="8"
            fill="none" stroke-linecap="round"/>
      <path d="M820 360 L500 214" stroke="#16232E" stroke-width="8"
            fill="none" stroke-linecap="round"/>
      <text x="110" y="396" class="d-lbl">Roof panel</text>

      <!-- ridge roll cap -->
      <path d="M300 246 L450 152 L600 246" stroke="#16232E" stroke-width="8"
            fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="450" y="120" class="d-lbl" text-anchor="middle">Ridge roll</text>

      <!-- wind-driven rain: under the cap edge, along the void, out at the apex -->
      <path d="M240 212 L292 242" class="d-bad-s"/>
      <polygon points="296,244 274.6,241 282.6,227.2" class="d-bad"/>
      <path d="M306 242 L440 182" class="d-dash"/>
      <path d="M450 198 V300" class="d-dash"/>
      <circle cx="450" cy="320" r="7" class="d-bad"/>
      <circle cx="450" cy="346" r="7" class="d-bad"/>

      <text x="612" y="146" class="d-lbl d-lbl-bad">Sealant bead, missing</text>
      <path d="M606 154 L566 222" class="d-bad-s" stroke-width="3"/>
    </svg>
  </div>

  <div class="fact means" style="margin-top:44px">
    <div class="label">What it usually means</div>
    <div class="body">The cap is on, the sealant bead underneath is not. Heavy rain
      gets driven straight in at the apex.</div>
  </div>

  <div class="fact" style="margin-top:30px">
    <div class="label">Usually costs</div>
    <div class="price">&#8369;6,500 &ndash; &#8369;15,000</div>
  </div>

  <div class="sig" style="margin-top:34px">
    <span>Trueline Roof Care</span>
    <span>Santa Rosa, Laguna</span>
  </div>

</div>
</body>
</html>

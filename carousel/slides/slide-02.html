<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trueline carousel — 02 sign 01, ceiling stain</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="slide">

  <div class="rail">
    <span>Sign 01 of 06</span>
    <span class="count">Repair, not re-roof</span>
  </div>

  <div class="h2" style="margin-top:50px">The stain that only<br>shows in heavy rain</div>

  <div class="plate" style="margin-top:36px">
    <svg width="900" height="448" viewBox="0 0 900 448" role="img"
         aria-label="Cross section: water enters the roof at one point, runs down a purlin, and drips onto the ceiling somewhere else.">

      <!-- roof panel -->
      <rect x="70" y="82" width="760" height="27" class="d-panel"/>
      <g stroke="#8E9AA4" stroke-width="2">
        <path d="M110 82v27M150 82v27M190 82v27M230 82v27M270 82v27M310 82v27M350 82v27
                 M390 82v27M430 82v27M470 82v27M510 82v27M550 82v27M590 82v27M630 82v27
                 M670 82v27M710 82v27M750 82v27M790 82v27"/>
      </g>
      <text x="70" y="140" class="d-lbl">Roof panel</text>

      <!-- the sloped purlin the water tracks along -->
      <path d="M786 138 L246 244" stroke="#2C4356" stroke-width="11" stroke-linecap="round"/>
      <text x="470" y="238" class="d-lbl">Purlin</text>

      <!-- entry point -->
      <circle cx="690" cy="96" r="16" class="d-bad-s"/>
      <path d="M690 66 v-8" class="d-bad-s"/>
      <text x="690" y="52" class="d-lbl d-lbl-bad" text-anchor="middle">Where it gets in</text>

      <!-- the travel path, offset just clear of the purlin so it stays readable -->
      <path d="M690 112 V146" class="d-dash"/>
      <path d="M686 149 L292 226" class="d-dash"/>
      <path d="M290 232 V286" class="d-dash"/>
      <circle cx="290" cy="252" r="5" class="d-bad"/>
      <circle cx="290" cy="274" r="5" class="d-bad"/>

      <!-- ceiling board + the stain -->
      <rect x="70" y="296" width="760" height="27" fill="#DED7C9"/>
      <ellipse cx="290" cy="309" rx="128" ry="17" fill="#C4622D" opacity=".20"/>
      <ellipse cx="290" cy="309" rx="88"  ry="13" fill="#C4622D" opacity=".42"/>
      <text x="700" y="352" class="d-lbl" text-anchor="middle">Ceiling board</text>
      <text x="290" y="380" class="d-lbl d-lbl-bad" text-anchor="middle">Where you see it</text>
    </svg>
  </div>

  <div class="fact means" style="margin-top:44px">
    <div class="label">What it usually means</div>
    <div class="body">Water is entering somewhere else and running along a purlin.
      The leak is rarely above the stain.</div>
  </div>

  <div class="fact" style="margin-top:30px">
    <div class="label">Usually costs</div>
    <div class="price">&#8369;6,500 &ndash; &#8369;14,000</div>
  </div>

  <div class="sig" style="margin-top:34px">
    <span>Trueline Roof Care</span>
    <span>Santa Rosa, Laguna</span>
  </div>

</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trueline carousel — 05 sign 04, panel lifting at the side lap</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="slide">

  <div class="rail">
    <span>Sign 04 of 06</span>
    <span class="count">Repair, not re-roof</span>
  </div>

  <div class="h2" style="margin-top:50px">A panel lifting<br>at the side lap</div>

  <div class="plate" style="margin-top:36px">
    <svg width="900" height="448" viewBox="0 0 900 448" role="img"
         aria-label="Cross section: the overlapping edge of the upper panel has been worked loose by wind, leaving a wedge-shaped gap over the lap.">

      <!-- habagat -->
      <path d="M846 118 L726 150" class="d-bad-s"/>
      <polygon points="726,150 747,153 743,137" class="d-bad"/>
      <text x="850" y="102" class="d-lbl d-lbl-bad" text-anchor="end">Habagat</text>

      <!-- the wedge, bounded by the seated panel below and the lifted panel above -->
      <polygon points="470,150 620,208 620,224 470,224" fill="#C4622D" opacity=".30"/>

      <!-- seated panel, running under the lap -->
      <path d="M90 224 H236 L250 198 H292 L306 224 H620"
            stroke="#16232E" stroke-width="7" fill="none"
            stroke-linejoin="round" stroke-linecap="round"/>
      <text x="90" y="196" class="d-lbl">Seated panel</text>

      <!-- lifted panel, riding over it -->
      <path d="M470 150 L660 224 H704 L718 198 H760 L774 224 H830"
            stroke="#16232E" stroke-width="7" fill="none"
            stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M470 150 L620 208" class="d-bad-s"/>

      <text x="556" y="118" class="d-lbl d-lbl-bad" text-anchor="middle">Lifted at the lap</text>
      <path d="M556 126 V176" class="d-bad-s" stroke-width="3"/>

      <!-- purlin -->
      <rect x="200" y="228" width="400" height="36" class="d-steel"/>
      <text x="230" y="298" class="d-lbl">Purlin</text>
      <text x="556" y="298" class="d-lbl" text-anchor="middle">Side lap</text>
    </svg>
  </div>

  <div class="fact means" style="margin-top:44px">
    <div class="label">What it usually means</div>
    <div class="body">Wind got under the overlap and worked it loose. Refasten and
      reseal the lap and the panel stays.</div>
  </div>

  <div class="fact" style="margin-top:30px">
    <div class="label">Usually costs</div>
    <div class="price">&#8369;9,000 &ndash; &#8369;22,000</div>
  </div>

  <div class="sig" style="margin-top:34px">
    <span>Trueline Roof Care</span>
    <span>Santa Rosa, Laguna</span>
  </div>

</div>
</body>
</html>

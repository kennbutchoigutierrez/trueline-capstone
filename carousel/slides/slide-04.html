<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trueline carousel — 04 sign 03, dead rubber washers</title>
<link rel="stylesheet" href="slides.css">
<style>
  .d-price{font-family:'Fraunces',serif;font-size:42px;font-weight:700;fill:var(--copper)}
</style>
</head>
<body>
<div class="slide">

  <div class="rail">
    <span>Sign 03 of 06</span>
    <span class="count">Repair, not re-roof</span>
  </div>

  <div class="h2" style="margin-top:50px">Dead rubber washers</div>

  <div class="plate" style="margin-top:36px">
    <svg width="900" height="448" viewBox="0 0 900 448" role="img"
         aria-label="Enlarged cross section of a tekscrew: the rubber washer under the head has perished and split open, letting water past the fastener.">

      <text x="400" y="62" class="d-lbl" text-anchor="middle">Tekscrew</text>

      <!-- hex head -->
      <polygon points="454,132 427,178.8 373,178.8 346,132 373,85.2 427,85.2" class="d-slate"/>
      <!-- shank -->
      <rect x="387" y="180" width="26" height="132" class="d-slate"/>
      <!-- steel washer -->
      <rect x="336" y="184" width="128" height="18" class="d-steel"/>

      <!-- EPDM washer: left side intact, right side perished and split open -->
      <rect x="344" y="202" width="43" height="28" fill="#C4622D"/>
      <rect x="413" y="202" width="15" height="28" fill="#C4622D"/>
      <rect x="438" y="202" width="18" height="28" fill="#C4622D"/>
      <path d="M428 202 v28 M438 202 v28" stroke="#8A3D14" stroke-width="2.5"/>

      <!-- roof panel -->
      <rect x="70" y="230" width="760" height="30" class="d-panel"/>
      <g stroke="#8E9AA4" stroke-width="2">
        <path d="M120 230v30M170 230v30M220 230v30M270 230v30M320 230v30
                 M500 230v30M550 230v30M600 230v30M650 230v30M700 230v30M750 230v30M800 230v30"/>
      </g>
      <text x="70" y="298" class="d-lbl">Roof panel</text>

      <!-- what gets past it -->
      <circle cx="433" cy="288" r="6" class="d-bad"/>
      <circle cx="433" cy="316" r="6" class="d-bad"/>
      <circle cx="433" cy="344" r="6" class="d-bad"/>

      <!-- callout, routed clear of the panel band -->
      <path d="M470 216 H556 V162" class="d-bad-s" stroke-width="3"/>
      <text x="568" y="156" class="d-lbl d-lbl-bad">EPDM washer</text>
      <text x="568" y="120" class="d-price">&#8369;18 each</text>
    </svg>
  </div>

  <div class="fact means" style="margin-top:44px">
    <div class="label">What it usually means</div>
    <div class="body">The rubber perishes in about eight years. The panel it sits on
      is usually still sound.</div>
  </div>

  <div class="fact" style="margin-top:30px">
    <div class="label">Usually costs</div>
    <div class="price">&#8369;6,500 &ndash; &#8369;12,000</div>
  </div>

  <div class="sig" style="margin-top:34px">
    <span>Trueline Roof Care</span>
    <span>Santa Rosa, Laguna</span>
  </div>

</div>
</body>
</html>

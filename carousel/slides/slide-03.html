<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trueline carousel — 03 sign 02, rust around tekscrews</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="slide">

  <div class="rail">
    <span>Sign 02 of 06</span>
    <span class="count">Repair, not re-roof</span>
  </div>

  <div class="h2" style="margin-top:50px">Rust blooming<br>around the tekscrews</div>

  <div class="plate" style="margin-top:36px">
    <svg width="900" height="448" viewBox="0 0 900 448" role="img"
         aria-label="Panel seen from above: rust rings spreading outward from two fastener heads, a third fastener sound.">

      <text x="70" y="52" class="d-lbl">Panel, seen from above</text>

      <!-- panel -->
      <rect x="70" y="72" width="760" height="286" class="d-panel"/>
      <g stroke="#8E9AA4" stroke-width="2.5">
        <path d="M165 72v286M260 72v286M355 72v286M450 72v286M545 72v286M640 72v286M735 72v286"/>
      </g>

      <!-- rust bloom, fastener 1 -->
      <circle cx="260" cy="215" r="66" fill="#C4622D" opacity=".17"/>
      <circle cx="260" cy="215" r="41" fill="#C4622D" opacity=".34"/>
      <!-- rust bloom, fastener 3 -->
      <circle cx="640" cy="215" r="58" fill="#C4622D" opacity=".15"/>
      <circle cx="640" cy="215" r="35" fill="#C4622D" opacity=".30"/>
      <!-- sound fastener -->
      <circle cx="450" cy="215" r="34" class="d-good" opacity=".85"/>

      <!-- fastener heads -->
      <g class="d-slate">
        <polygon points="277,215 268.5,229.7 251.5,229.7 243,215 251.5,200.3 268.5,200.3"/>
        <polygon points="467,215 458.5,229.7 441.5,229.7 433,215 441.5,200.3 458.5,200.3"/>
        <polygon points="657,215 648.5,229.7 631.5,229.7 623,215 631.5,200.3 648.5,200.3"/>
      </g>

      <text x="260" y="404" class="d-lbl d-lbl-bad" text-anchor="middle">Rust bloom</text>
      <text x="450" y="404" class="d-lbl" text-anchor="middle" style="fill:#3E6B57">Sound</text>
    </svg>
  </div>

  <div class="fact means" style="margin-top:44px">
    <div class="label">What it usually means</div>
    <div class="body">The fastener seal went first, not the panel. Rust starts at the
      hole and spreads outward from there.</div>
  </div>

  <div class="fact" style="margin-top:30px">
    <div class="label">Usually costs</div>
    <div class="price">&#8369;7,500 &ndash; &#8369;18,000</div>
  </div>

  <div class="sig" style="margin-top:34px">
    <span>Trueline Roof Care</span>
    <span>Santa Rosa, Laguna</span>
  </div>

</div>
</body>
</html>

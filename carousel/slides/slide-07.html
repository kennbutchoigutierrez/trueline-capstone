<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trueline carousel — 07 sign 06, canal rusted through</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<div class="slide">

  <div class="rail">
    <span>Sign 06 of 06</span>
    <span class="count">Repair, not re-roof</span>
  </div>

  <div class="h2" style="margin-top:50px">A canal rusted<br>through at the bottom</div>

  <div class="plate" style="margin-top:36px">
    <svg width="900" height="448" viewBox="0 0 900 448" role="img"
         aria-label="Cross section of a gutter: the canal holds standing water and has rusted through at its lowest point, so water drips out underneath instead of draining away.">

      <!-- roof panel discharging into the canal -->
      <path d="M70 110 L346 192" stroke="#16232E" stroke-width="8"
            fill="none" stroke-linecap="round"/>
      <text x="70" y="86" class="d-lbl">Roof panel</text>

      <!-- standing water -->
      <polygon points="343,248 570,248 558,312 355,312" fill="#A9B4BC" opacity=".55"/>

      <!-- the canal, broken open at its lowest point -->
      <path d="M326 166 L356 316 H436" stroke="#2C4356" stroke-width="10"
            fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M486 316 H556 L586 166" stroke="#2C4356" stroke-width="10"
            fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="436" cy="316" r="8" class="d-bad"/>
      <circle cx="486" cy="316" r="8" class="d-bad"/>
      <text x="616" y="178" class="d-lbl">Canal</text>

      <!-- draining where it should not -->
      <circle cx="461" cy="340" r="7" class="d-bad"/>
      <circle cx="461" cy="364" r="7" class="d-bad"/>
      <circle cx="461" cy="388" r="7" class="d-bad"/>

      <text x="461" y="422" class="d-lbl d-lbl-bad" text-anchor="middle">Rusted through</text>
    </svg>
  </div>

  <div class="fact means" style="margin-top:44px">
    <div class="label">What it usually means</div>
    <div class="body">The gutter fails long before the roof does. It sits in standing
      water; the panels do not.</div>
  </div>

  <div class="fact" style="margin-top:30px">
    <div class="label">Usually costs</div>
    <div class="price">&#8369;8,500 &ndash; &#8369;28,000</div>
  </div>

  <div class="sig" style="margin-top:34px">
    <span>Trueline Roof Care</span>
    <span>Santa Rosa, Laguna</span>
  </div>

</div>
</body>
</html>

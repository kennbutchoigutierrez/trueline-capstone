<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trueline email masthead</title>
<link rel="stylesheet" href="../carousel/slides/fonts.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:260px;overflow:hidden}
  .bar{
    width:1200px;height:260px;position:relative;overflow:hidden;
    background:url("../site/images/founder-roof.jpg") center 38% / cover no-repeat;
  }
  .scrim{
    position:absolute;inset:0;
    background:linear-gradient(90deg,
      rgba(22,35,46,.97) 0%, rgba(22,35,46,.94) 38%,
      rgba(22,35,46,.72) 72%, rgba(22,35,46,.52) 100%);
  }
  .inner{
    position:relative;z-index:2;height:100%;
    padding:0 64px;display:flex;flex-direction:column;justify-content:center;
  }
  .mark{
    font-family:'Fraunces',Georgia,serif;font-weight:700;
    font-size:54px;line-height:1;letter-spacing:-.018em;color:#F6F4EF;
  }
  .rule{width:88px;height:5px;background:#C4622D;margin:20px 0 16px}
  .sub{
    font-family:'Inter',Helvetica,Arial,sans-serif;font-weight:500;
    font-size:21px;letter-spacing:.05em;color:rgba(246,244,239,.74);
  }
</style>
</head>
<body>
<div class="bar">
  <div class="scrim"></div>
  <div class="inner">
    <div class="mark">Trueline Roof Care</div>
    <div class="rule"></div>
    <div class="sub">Santa Rosa, Laguna &middot; repairs, care plans, new installs</div>
  </div>
</div>
</body>
</html>
